name: Build Windows Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows OpenDeck Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust and Windows toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            zip

      - name: Build Windows executable
        run: |
          cargo build \
            --release \
            --target x86_64-pc-windows-gnu \
            --target-dir target/plugin-win

      - name: Assemble OpenDeck plugin
        run: |
          PLUGIN_ID="com.github.ambiso.opendeck-akp05.sdPlugin"

          rm -rf build
          mkdir -p "build/$PLUGIN_ID"

          cp -r assets "build/$PLUGIN_ID/"
          cp manifest.json "build/$PLUGIN_ID/"

          cp \
            target/plugin-win/x86_64-pc-windows-gnu/release/opendeck-akp05.exe \
            "build/$PLUGIN_ID/opendeck-akp05-win.exe"

      - name: Create plugin ZIP
        run: |
          cd build
          zip -r opendeck-akp05.plugin.zip \
            com.github.ambiso.opendeck-akp05.sdPlugin

      - name: Upload finished plugin
        uses: actions/upload-artifact@v4
        with:
          name: opendeck-akp05-windows-plugin
          path: build/opendeck-akp05.plugin.zip
